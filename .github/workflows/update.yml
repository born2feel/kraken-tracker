name: Update rates

# Every day the bot fetches fresh rates and commits them to data/,
# so the repository itself becomes a growing dataset with a live chart.
on:
  schedule:
    - cron: "30 13 * * *" # 16:30 Moscow time; CBR publishes rates for the next day by ~15:30
  workflow_dispatch: # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e .
      - run: python -m cbr_rates update --codes USD,EUR,CNY
      - run: python -m cbr_rates plot USD --from-csv data/rates.csv -o data/usd.png
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "data: rates for $(date -u +%F)"
          git push
